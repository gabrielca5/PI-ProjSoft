name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cursos-api-ci:${{ github.sha }}

    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_TEST }}
        username: "ubuntu"
        key: ${{ secrets.KEY_TEST }}
        port: 22
        script: |
          docker network create cursos-net 2>/dev/null || true

          if [ ! "$(docker ps -aq -f name=pg-cursos)" ]; then
            docker run -d --name pg-cursos --network cursos-net --restart unless-stopped \
              -e POSTGRES_DB=cursos \
              -e POSTGRES_USER=${{ secrets.DB_USER }} \
              -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -v pgdata:/var/lib/postgresql/data \
              postgres:15-alpine
          fi

          docker stop cursos-api || true
          docker rm --force cursos-api || true
          docker run -d -p 8081:8080 --network cursos-net --restart unless-stopped \
            -e DB_HOST=pg-cursos \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e USERS_API_URL=${{ secrets.USERS_API_URL }} \
            --name cursos-api ${{ secrets.DOCKERHUB_USERNAME }}/cursos-api-ci:${{ github.sha }}
