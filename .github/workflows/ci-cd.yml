name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes + checar cobertura (100% no service)
        run: mvn -B verify

  deploy:
    name: Deploy na AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build do jar
        run: mvn -B clean package -DskipTests

      - name: Copiar jar para a instância AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "target/cursos-api-0.0.1-SNAPSHOT.jar"
          target: "/home/${{ secrets.AWS_USER }}/app"

      - name: Reiniciar aplicação na instância AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo systemctl stop cursos-api || true
            sudo cp /home/${{ secrets.AWS_USER }}/app/target/cursos-api-0.0.1-SNAPSHOT.jar /opt/cursos-api/cursos-api.jar
            sudo systemctl start cursos-api
