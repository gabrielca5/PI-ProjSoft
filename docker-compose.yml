version: '3.8'

services:
  cursos-api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursos-api-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - USERS_API_URL=${USERS_API_URL:-http://18.228.48.67}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
